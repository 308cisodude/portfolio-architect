type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: ready
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Plan ready
    tap_action:
      action: more-info
    color: green
    icon: mdi:clipboard-check-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: waiting_for_reserve
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Waiting for investment cash
    tap_action:
      action: more-info
    color: amber
    icon: mdi:cash-clock
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: deferred_for_cost_efficiency
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Waiting for cost-efficient execution
    tap_action:
      action: more-info
    color: amber
    icon: mdi:timer-sand
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: no_eligible_purchase
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: No eligible purchase
    tap_action:
      action: more-info
    color: blue
    icon: mdi:clipboard-text-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: reserve_unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Investment cash unavailable
    tap_action:
      action: more-info
    color: red
    icon: mdi:bank-off-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Plan unavailable
    tap_action:
      action: more-info
    color: red
    icon: mdi:clipboard-remove-outline
    state_content: plan_actionability_detail
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: baseline_established
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: unchanged
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_plan_change
    name: Changes since previous evaluation
    tap_action:
      action: more-info
    color: blue
    icon: mdi:delta
  grid_options:
    columns: full
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_plan_budget
  name: Plan budget
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:wallet-outline
- type: tile
  entity: sensor.portfolio_architect_plan_frequency
  name: Frequency
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:calendar-sync-outline
- type: tile
  entity: sensor.portfolio_architect_monthly_contribution
  name: Per execution
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:cash-fast
- type: tile
  entity: sensor.portfolio_architect_recommended_total
  name: Allocated
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: green
  icon: mdi:cash-check
- type: tile
  entity: sensor.portfolio_architect_purchase_count
  name: Purchases
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:cart-outline
- type: tile
  entity: sensor.portfolio_architect_executions_per_period
  name: Executions
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:calendar-multiselect
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_planned_execution
    state_not: unavailable
  card:
    type: tile
    entity: date.portfolio_architect_planned_execution
    name: Scheduled execution
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_planned_execution
    icon: mdi:calendar-arrow-right
  grid_options:
    columns: 6
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_plan_actionability
  name: Actionability
  tap_action:
    action: more-info
  icon: mdi:calendar-check-outline
  grid_options:
    columns: 6
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_last_successful_refresh
  name: Last evaluated
  tap_action:
    action: more-info
  icon: mdi:clock-check-outline
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_unallocated_contribution
    above: 0.01
  card:
    type: tile
    entity: sensor.portfolio_architect_unallocated_contribution
    name: Unallocated
    tap_action:
      action: more-info
    color: amber
    icon: mdi:cash-clock
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_world_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_world_proposed_buy
    name: MSCI World
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_world_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_world_proposed_buy
    state_content:
    - state
    - execution_provider_name
  grid_options:
    columns: 6
    rows: auto
