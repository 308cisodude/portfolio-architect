views:
- title: EN
  path: portfolio-architect
  type: sections
  max_columns: 2
  dense_section_placement: false
  header:
    layout: responsive
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Investment plan
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: ready
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Plan ready
        tap_action:
          action: more-info
        color: green
        icon: mdi:clipboard-check-outline
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: waiting_for_reserve
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Waiting for investment cash
        tap_action:
          action: more-info
        color: amber
        icon: mdi:cash-clock
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
