views:
- title: EN
  path: portfolio-architect
  type: sections
  max_columns: 2
  dense_section_placement: false
  header:
    layout: responsive
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Investment plan
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: ready
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Plan ready
        tap_action:
          action: more-info
        color: green
        icon: mdi:clipboard-check-outline
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: waiting_for_reserve
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Waiting for investment cash
        tap_action:
          action: more-info
        color: amber
        icon: mdi:cash-clock
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: deferred_for_cost_efficiency
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Waiting for cost-efficient execution
        tap_action:
          action: more-info
        color: amber
        icon: mdi:timer-sand
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: no_eligible_purchase
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: No eligible purchase
        tap_action:
          action: more-info
        color: blue
        icon: mdi:clipboard-text-outline
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: reserve_unavailable
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Investment cash unavailable
        tap_action:
          action: more-info
        color: red
        icon: mdi:bank-off-outline
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_execution_state
        state: unavailable
      card:
        type: tile
        entity: sensor.portfolio_architect_execution_state
        name: Plan unavailable
        tap_action:
          action: more-info
        color: red
        icon: mdi:clipboard-remove-outline
        hide_state: true
      grid_options:
        columns: full
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.portfolio_architect_plan_change
        state_not: baseline_established
      - condition: state
        entity: sensor.portfolio_architect_plan_change
        state_not: unchanged
      - condition: state
        entity: sensor.portfolio_architect_plan_change
        state_not: unavailable
      card:
        type: tile
        entity: sensor.portfolio_architect_plan_change
        name: Changes since previous evaluation
        tap_action:
          action: more-info
        color: blue
        icon: mdi:delta
      grid_options:
        columns: full
        rows: auto
    - type: tile
