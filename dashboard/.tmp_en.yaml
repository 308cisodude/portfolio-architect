        type: markdown
        title: Order identifiers
        entity_id:
        - sensor.portfolio_architect_purchase_count
        - sensor.portfolio_architect_world_proposed_buy
        - sensor.portfolio_architect_emerging_markets_proposed_buy
        - sensor.portfolio_architect_world_small_cap_proposed_buy
        - sensor.portfolio_architect_healthcare_proposed_buy
        - sensor.portfolio_architect_ai_big_data_proposed_buy
        - sensor.portfolio_architect_cybersecurity_proposed_buy
        - sensor.portfolio_architect_robotics_proposed_buy
        content: "{% set buy_entities = [\n  'sensor.portfolio_architect_world_proposed_buy',\n  'sensor.portfolio_architect_emerging_markets_proposed_buy',\n  'sensor.portfolio_architect_world_small_cap_proposed_buy',\n  'sensor.portfolio_architect_healthcare_proposed_buy',\n  'sensor.portfolio_architect_ai_big_data_proposed_buy',\n  'sensor.portfolio_architect_cybersecurity_proposed_buy',\n  'sensor.portfolio_architect_robotics_proposed_buy'\n] %}\n{% for entity_id in buy_entities %}\n{% if states(entity_id) | float(0) > 0 %}\n**{{ state_attr(entity_id, 'fund_name') }}** — `{{ state_attr(entity_id, 'isin') }}`\n\n{% endif %}\n{% endfor %}\n"
