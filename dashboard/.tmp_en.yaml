      card:
        type: tile
        entity: sensor.portfolio_architect_unallocated_contribution
        name: Unallocated
        tap_action:
          action: more-info
        color: amber
        icon: mdi:cash-clock
      grid_options:
        columns: 6
        rows: auto
    - type: tile
