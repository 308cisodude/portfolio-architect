    name: Letzte Auswertung
    tap_action:
      action: more-info
    grid_options:
      columns: full
      rows: auto
    icon: mdi:clock-check-outline
    state_content:
    - state
    - engine_version
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_source_provider
      state: local_rest_json
    - condition: state
      entity: binary_sensor.portfolio_architect_gateway_reauthentication_required
      state: 'on'
