    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.portfolio_architect_exception_review_overdue
      state: 'off'
    card:
      type: tile
      entity: sensor.portfolio_architect_next_exception_review
      name: Nächste Prüfung
      tap_action:
        action: more-info
      color: amber
      icon: mdi:calendar-clock
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_last_exception_decision
      state_not: unavailable
    card:
      type: tile
      entity: sensor.portfolio_architect_last_exception_decision
      name: Letzte Entscheidung
      tap_action:
        action: more-info
      icon: mdi:calendar-check
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_robotics_accumulating_preferred_policy_exception
      state: accepted_exception
    card:
      type: tile
      entity: sensor.portfolio_architect_robotics_accumulating_preferred_policy_exception
      name: Robotik-Ausnahme
      tap_action:
        action: more-info
      color: amber
      icon: mdi:shield-half-full
      hide_state: true
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_world_free_savings_plan_preferred_policy_finding
      state: opportunity
    card:
      type: tile
      entity: sensor.portfolio_architect_world_free_savings_plan_preferred_policy_finding
