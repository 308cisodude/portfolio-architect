      tap_action:
        action: more-info
      color: blue
      icon: mdi:cash-remove
      hide_state: true
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_emerging_markets_free_savings_plan_preferred_policy_finding
