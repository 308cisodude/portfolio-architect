      state_content: source_summary
      tap_action:
        action: more-info
      icon: mdi:source-branch
      color: blue
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.portfolio_architect_world_small_cap_position_sources
