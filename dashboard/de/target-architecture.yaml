type: vertical-stack
cards:
- type: tile
  entity: sensor.portfolio_architect_target_position_coverage
  name: Abdeckung
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:target
  features:
  - type: bar-gauge
    min: 0
    max: 100
- type: tile
  entity: binary_sensor.portfolio_architect_target_architecture_complete
  name: Architektur
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: state
  icon: mdi:vector-arrange-below
  state_content: coverage_summary
- type: glance
  title: Zielpositionen · ✓ Vorhanden · ○ Fehlt
  columns: 2
  show_name: true
  show_state: false
  state_color: true
  entities:
  - entity: binary_sensor.portfolio_architect_world_target_position_held
    name: MSCI World
  - entity: binary_sensor.portfolio_architect_emerging_markets_target_position_held
    name: Emerging Markets
  - entity: binary_sensor.portfolio_architect_world_small_cap_target_position_held
    name: World Small Cap
  - entity: binary_sensor.portfolio_architect_healthcare_target_position_held
    name: Gesundheit
  - entity: binary_sensor.portfolio_architect_ai_big_data_target_position_held
    name: AI & Big Data
  - entity: binary_sensor.portfolio_architect_cybersecurity_target_position_held
    name: Cybersecurity
  - entity: binary_sensor.portfolio_architect_robotics_target_position_held
    name: Robotik
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_world_position_sources
    above: 1
  card:
    type: tile
    entity: sensor.portfolio_architect_world_position_sources
    name: Quellen MSCI World
    state_content: source_summary
    tap_action:
      action: more-info
    icon: mdi:source-branch
    color: blue
  grid_options:
    columns: full
    rows: auto
