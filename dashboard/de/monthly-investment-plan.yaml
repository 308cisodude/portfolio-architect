type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: ready
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Plan bereit
    tap_action:
      action: more-info
    color: green
    icon: mdi:clipboard-check-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: waiting_for_reserve
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Warten auf Anlageguthaben
    tap_action:
      action: more-info
    color: amber
    icon: mdi:cash-clock
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: deferred_for_cost_efficiency
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Warten auf kosteneffiziente Ausführung
    tap_action:
      action: more-info
    color: amber
    icon: mdi:timer-sand
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: no_eligible_purchase
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Kein geeigneter Kauf
    tap_action:
      action: more-info
    color: blue
    icon: mdi:clipboard-text-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: reserve_unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Anlageguthaben nicht verfügbar
    tap_action:
      action: more-info
    color: red
    icon: mdi:bank-off-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_state
    state: unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_execution_state
    name: Plan nicht verfügbar
    tap_action:
      action: more-info
    color: red
    icon: mdi:clipboard-remove-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: baseline_established
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: unchanged
  - condition: state
    entity: sensor.portfolio_architect_plan_change
    state_not: unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_plan_change
    state_content: display_state_de
    name: Änderungen seit letzter Auswertung
    tap_action:
      action: more-info
    color: blue
    icon: mdi:delta
  grid_options:
    columns: full
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_plan_budget
  name: Planbudget
  state_content: display_state_de
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:wallet-outline
- type: tile
  entity: sensor.portfolio_architect_plan_frequency
  name: Intervall
  state_content: display_state_de
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:calendar-sync-outline
- type: tile
  entity: sensor.portfolio_architect_monthly_contribution
  name: Je Ausführung
  state_content: display_state_de
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:cash-fast
- type: tile
  entity: sensor.portfolio_architect_plan_actionability
  name: Zugeordnet
  state_content: recommended_total_display_de
  tap_action:
    action: more-info
    entity: sensor.portfolio_architect_recommended_total
  grid_options:
    columns: 6
    rows: auto
  color: green
  icon: mdi:cash-check
- type: tile
  entity: sensor.portfolio_architect_plan_actionability
  name: Käufe
  state_content: purchase_count_display_de
  tap_action:
    action: more-info
    entity: sensor.portfolio_architect_purchase_count
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:cart-outline
- type: tile
  entity: sensor.portfolio_architect_executions_per_period
  name: Ausführungen
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:calendar-multiselect
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_planned_execution
    state_not: unavailable
  card:
    type: tile
    entity: sensor.portfolio_architect_planned_execution
    name: Geplante Ausführung
    tap_action:
      action: more-info
    icon: mdi:calendar-arrow-right
  grid_options:
    columns: 6
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_plan_actionability
  name: Umsetzbarkeit
  state_content: display_state_de
  tap_action:
    action: more-info
  icon: mdi:calendar-check-outline
  grid_options:
    columns: 6
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_last_successful_refresh
  name: Zuletzt ausgewertet
  state_content: display_state_de
  tap_action:
    action: more-info
  icon: mdi:clock-check-outline
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_unallocated_contribution
    above: 0.01
  card:
    type: tile
    entity: sensor.portfolio_architect_unallocated_contribution
    name: Nicht zugeordnet
    tap_action:
      action: more-info
    color: amber
    icon: mdi:cash-clock
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_world_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_world_proposed_buy
    name: MSCI World
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_world_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_world_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_emerging_markets_proposed_buy
