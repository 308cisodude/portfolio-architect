    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_emerging_markets_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
