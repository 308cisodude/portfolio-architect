    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_world_small_cap_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_world_small_cap_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_healthcare_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_healthcare_proposed_buy
    name: Gesundheit
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_healthcare_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_healthcare_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_ai_big_data_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_ai_big_data_proposed_buy
    name: AI & Big Data
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_ai_big_data_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_ai_big_data_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_cybersecurity_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_cybersecurity_proposed_buy
    name: Cybersecurity
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_cybersecurity_isin
    color: green
    icon: mdi:cart-arrow-down
    hold_action:
      action: more-info
      entity: sensor.portfolio_architect_cybersecurity_proposed_buy
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_robotics_proposed_buy
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_robotics_proposed_buy
    name: Robotik
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_robotics_isin
    color: green
    icon: mdi:cart-arrow-down
