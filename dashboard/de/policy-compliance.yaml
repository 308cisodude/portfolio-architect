type: vertical-stack
cards:
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
    state: 'on'
  card:
    type: tile
    entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
    name: Verbindliche Kontrollen konform
    tap_action:
      action: more-info
    color: green
    icon: mdi:shield-check-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
    state: 'off'
  card:
    type: tile
    entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
    name: Kontrollen benötigen Aufmerksamkeit
    tap_action:
      action: more-info
    color: red
    icon: mdi:shield-alert-outline
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_policy_error_findings
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_policy_error_findings
    name: Fehler
    tap_action:
      action: more-info
    color: red
    icon: mdi:alert-octagon-outline
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_policy_warning_findings
    above: 0
  card:
    type: tile
    entity: sensor.portfolio_architect_policy_warning_findings
    name: Warnungen
    tap_action:
      action: more-info
    color: amber
    icon: mdi:alert-outline
  grid_options:
    columns: 6
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_accepted_exception_count
  name: Ausnahmen
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: amber
  icon: mdi:shield-half-full
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_last_exception_decision
    state_not: unavailable
  card:
    type: tile
    entity: date.portfolio_architect_last_exception_decision
    name: Letzte Entscheidung
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_last_exception_decision
    icon: mdi:calendar-check
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_exception_review_overdue
    state: 'on'
  card:
    type: tile
    entity: date.portfolio_architect_oldest_overdue_exception_review
    name: Überfällige Prüfung
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_oldest_overdue_exception_review
    color: red
    icon: mdi:calendar-alert
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_exception_review_overdue
    state: 'off'
  card:
    type: tile
    entity: date.portfolio_architect_next_exception_review
    name: Ausnahmeprüfung
    tap_action:
      action: more-info
      entity: sensor.portfolio_architect_next_exception_review
    color: amber
    icon: mdi:calendar-clock
  grid_options:
    columns: 6
    rows: auto
- type: conditional
  conditions:
  - condition: numeric_state
    entity: sensor.portfolio_architect_optimisation_opportunity_count
    above: 0
  card:
    type: heading
    heading: Optimierungsmöglichkeiten
    heading_style: subtitle
    icon: mdi:lightbulb-on-outline
    badges:
    - type: entity
      entity: sensor.portfolio_architect_optimisation_opportunity_count
      show_icon: false
      show_state: true
      tap_action:
        action: more-info
  grid_options:
    columns: full
    rows: auto
