      state: deferred
    card:
      type: entities
      title: Deferred targets
      show_header_toggle: false
    show_empty: false
    grid_options:
      columns: full
      rows: auto
- type: grid
  cards:
  - type: heading
    heading: Portfolio policy compliance
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
      state: 'on'
    card:
      type: tile
      entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
      name: Mandatory controls compliant
      tap_action:
        action: more-info
      color: green
      icon: mdi:shield-check-outline
      hide_state: true
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
      state: 'off'
    card:
      type: tile
      entity: binary_sensor.portfolio_architect_mandatory_controls_compliant
      name: Mandatory controls need attention
      tap_action:
        action: more-info
      color: red
      icon: mdi:shield-alert-outline
      hide_state: true
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.portfolio_architect_policy_error_findings
      above: 0
    card:
      type: tile
      entity: sensor.portfolio_architect_policy_error_findings
      name: Errors
      tap_action:
        action: more-info
      color: red
      icon: mdi:alert-octagon-outline
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.portfolio_architect_policy_warning_findings
      above: 0
    card:
      type: tile
      entity: sensor.portfolio_architect_policy_warning_findings
      name: Warnings
      tap_action:
        action: more-info
      color: amber
      icon: mdi:alert-outline
    grid_options:
      columns: 6
      rows: auto
  - type: tile
    entity: sensor.portfolio_architect_accepted_exception_count
    name: Exceptions
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: auto
    color: amber
    icon: mdi:shield-half-full
  - type: conditional
    conditions:
    - condition: state
      entity: sensor.portfolio_architect_last_exception_decision
      state_not: unavailable
    card:
      type: tile
      entity: date.portfolio_architect_last_exception_decision
      name: Last decision
      tap_action:
        action: more-info
        entity: sensor.portfolio_architect_last_exception_decision
      icon: mdi:calendar-check
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.portfolio_architect_exception_review_overdue
      state: 'on'
    card:
      type: tile
      entity: date.portfolio_architect_oldest_overdue_exception_review
      name: Overdue review
      tap_action:
        action: more-info
        entity: sensor.portfolio_architect_oldest_overdue_exception_review
      color: red
      icon: mdi:calendar-alert
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.portfolio_architect_exception_review_overdue
      state: 'off'
    card:
      type: tile
      entity: date.portfolio_architect_next_exception_review
      name: Exception review
      tap_action:
        action: more-info
        entity: sensor.portfolio_architect_next_exception_review
      color: amber
      icon: mdi:calendar-clock
    grid_options:
      columns: 6
      rows: auto
  - type: conditional
    conditions:
    - condition: numeric_state
      entity: sensor.portfolio_architect_optimisation_opportunity_count
      above: 0
    card:
      type: heading
      heading: Optimisation opportunities
      heading_style: subtitle
      icon: mdi:lightbulb-on-outline
      badges:
      - type: entity
        entity: sensor.portfolio_architect_optimisation_opportunity_count
        show_icon: false
        show_state: true
        tap_action:
          action: more-info
    grid_options:
      columns: full
      rows: auto
