  card:
    type: tile
    entity: sensor.portfolio_architect_deferred_contribution
    name:
      $i18n: purchase_deferred_for_cost_efficiency
    tap_action:
      action: more-info
    icon: mdi:timer-sand
    color: amber
    hide_state: false
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: sensor.portfolio_architect_execution_path
    state_not: unavailable
  - condition: state
    entity: sensor.portfolio_architect_execution_path
