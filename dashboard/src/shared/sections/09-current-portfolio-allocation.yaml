type: grid
cards:
- type: heading
  heading:
    $i18n: current_portfolio_allocation
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_portfolio_allocation_on_target
    state: 'on'
  card:
    type: tile
    entity: binary_sensor.portfolio_architect_portfolio_allocation_on_target
    name:
      $i18n: allocation_on_target
    tap_action:
      action: more-info
    color: green
    icon: mdi:scale-balance
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.portfolio_architect_portfolio_allocation_on_target
    state: 'off'
  card:
    type: tile
    entity: binary_sensor.portfolio_architect_portfolio_allocation_on_target
    name:
      $i18n: allocation_needs_rebalancing
    tap_action:
      action: more-info
    color: amber
    icon: mdi:scale-unbalanced
    hide_state: true
  grid_options:
    columns: full
    rows: auto
- type: tile
  entity: sensor.portfolio_architect_allocation_corridor
  name:
    $i18n: target_corridor
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  icon: mdi:arrow-expand-horizontal
- type: tile
  entity: sensor.portfolio_architect_underweight_position_count
  name:
    $i18n: underweight
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: amber
  icon: mdi:arrow-down-bold-outline
- type: tile
  entity: sensor.portfolio_architect_on_target_position_count
  name:
    $i18n: on_target
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: green
  icon: mdi:check-circle-outline
- type: tile
  entity: sensor.portfolio_architect_overweight_position_count
  name:
    $i18n: overweight
  tap_action:
    action: more-info
  grid_options:
    columns: 6
    rows: auto
  color: red
  icon: mdi:arrow-up-bold-outline
- type: conditional
  conditions:
