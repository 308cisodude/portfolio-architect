- title: DE
  path: portfolio-architekt
  type: sections
  max_columns: 2
  dense_section_placement: false
  header:
    layout: responsive
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Anlageplan
      grid_options:
        columns: full
        rows: auto
