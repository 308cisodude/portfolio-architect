name: Portfolio Architect Gateway — DKB
version: 1.66.0
slug: portfolio_architect_gateway_dkb
description: Explicit DKB CSV or manual read-only FinTS acquisition for one depot and selected EUR cash account, with 14-day FinTS expiry and no automatic fallback.
url: https://developers.home-assistant.io/docs/apps/
arch:
- amd64
- aarch64
startup: application
boot: auto
init: true
homeassistant: 2026.7.0
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:shield-outline
panel_title: Portfolio Gateway — DKB
panel_admin: true
host_network: false
hassio_api: false
homeassistant_api: false
auth_api: false
docker_api: false
discovery:
- portfolio_architect
apparmor: true
tmpfs: true
backup: cold
backup_exclude:
- gateway/dkb-fints-authority-evidence.json
- gateway/.dkb-fints-authority-evidence.json.*
- gateway/dkb-fints-canonical.json
- gateway/.dkb-fints-canonical.json.*
- gateway/dkb-fints-system-id.json
- gateway/.dkb-fints-system-id.json.*
- gateway/dkb-fints-fingerprint-key
- gateway/.dkb-fints-fingerprint-key.*
- gateway/dkb-fints-account-binding-key
- gateway/.dkb-fints-account-binding-key.*
- gateway/dkb-fints-investment-account.json
- gateway/.dkb-fints-investment-account.json.*
ports:
  8787/tcp: null
ports_description:
  8787/tcp: Verified-HTTPS Portfolio Architect REST endpoint; leave host mapping disabled
watchdog: tcp://[HOST]:[PORT:8787]
stage: stable
environment:
  PA_PROVIDER_ID: dkb
  PA_PROVIDER_NAME: DKB
options:
  health_endpoint_enabled: true
schema:
  health_endpoint_enabled: bool
