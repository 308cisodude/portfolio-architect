configuration:
  max_cached_snapshot_age_seconds:
    name: Maximales Alter des Zwischenspeichers
    description: Kompatibilitätseinstellung für die Live-Cache-Aufbewahrung. Statische
      DKB-CSV-Snapshots verfallen nicht durch diesen Wert; Portfolio Architect wendet
      die konfigurierte CSV-Frischegrenze an.
  health_endpoint_enabled:
    name: Authentifizierten Status-Endpunkt aktivieren
    description: Stellt /healthz am privaten REST-Dienst bereit; der Bearer-Token
      bleibt erforderlich.
network:
  8787/tcp: Privater REST-Endpunkt für Portfolio Architect; Host-Port deaktiviert
    lassen.
