configuration:
  poll_interval_seconds:
    name: Aktualisierungsintervall
    description: Sekunden zwischen den Aktualisierungsversuchen des Comdirect-Portfolios.
  max_cached_snapshot_age_seconds:
    name: Maximales Alter des Live-LKG-Snapshots
    description: Maximales Alter in Sekunden für einen zuvor erfolgreichen Live-API-Snapshot, der bei einem Ausfall der Live-Quelle weiter bereitgestellt wird. Dies ist nur eine Resilienzgrenze des Gateways; Portfolio Architect entscheidet separat über die Frische der Belege für die Planung. 0 deaktiviert das Alterslimit des Live-LKG.
  request_timeout_seconds:
    name: Zeitlimit für Comdirect-Anfragen
    description: Zeitlimit in Sekunden für jede ausgehende Comdirect-API-Anfrage.
  mfa_timeout_seconds:
    name: PhotoTAN-Zeitlimit
    description: Maximale Wartezeit in Sekunden auf die Freigabe der PhotoTAN-Push-Anfrage.
  health_endpoint_enabled:
    name: Authentifizierten Status-Endpunkt aktivieren
    description: Stellt /healthz am privaten REST-Dienst bereit; der Bearer-Token bleibt erforderlich.
  depot_ids:
    name: Depot-IDs
    description: Optionale exakte Comdirect-Depot-IDs; leer lassen, um alle sichtbaren Depots einzubeziehen.
network:
  8787/tcp: Privater REST-Endpunkt für Portfolio Architect; Host-Port deaktiviert lassen.
