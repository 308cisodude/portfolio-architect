configuration:
  max_cached_snapshot_age_seconds:
    name: Maximales Alter des Zwischenspeichers
    description: Kompatibilitätseinstellung für die Live-Cache-Aufbewahrung. Das Alter des aktiven importierten Trade-Republic-Gateway-Snapshots wird durch diesen Wert nicht begrenzt; Portfolio Architect wendet die konfigurierte Beleg-Frischegrenze an.
  health_endpoint_enabled:
    name: Authentifizierten Status-Endpunkt aktivieren
    description: Stellt /healthz am privaten REST-Dienst bereit; der Bearer-Token bleibt erforderlich.
network:
  8787/tcp: Privater REST-Endpunkt für Portfolio Architect; Host-Port deaktiviert lassen.
