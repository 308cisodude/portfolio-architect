name: Publish immutable release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/ci-python-3.14-linux-x86_64.txt
      - name: Install hash-locked release dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r requirements/ci-python-3.14-linux-x86_64.txt
      - name: Validate repository publication metadata
        run: python tools/check_publication.py --strict
      - name: Verify tag matches integration version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('custom_components/portfolio_architect/manifest.json').read_text())['version'])
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match v${version}" >&2
            exit 1
          }
      - name: Build and verify release artifacts
        run: ./tools/release_check.sh
      - name: Build provider App images
        shell: bash
        run: |
          version="$(python - <<'PYAPPVERSION'
          import json
          from pathlib import Path
          print(json.loads(Path('custom_components/portfolio_architect/manifest.json').read_text())['version'])
          PYAPPVERSION
          )"
          for app in \
            portfolio_architect_gateway \
            portfolio_architect_gateway_dkb \
            portfolio_architect_gateway_trade_republic
          do
            docker build \
              --build-arg BUILD_VERSION="${version}" \
              --build-arg BUILD_ARCH=amd64 \
              --tag "portfolio-architect-${app}:validation" \
              "home_assistant_app/${app}"
          done
      - name: Smoke-test provider shell containers
        shell: bash
        run: |
          for app in \
            portfolio_architect_gateway_dkb \
            portfolio_architect_gateway_trade_republic
          do
            name="portfolio-architect-${app}-smoke"
            image="portfolio-architect-${app}:validation"
            docker run --detach --name "${name}" "${image}" >/dev/null
            sleep 2
            if ! test "$(docker inspect --format '{{.State.Running}}' "${name}")" = "true"; then
              docker logs "${name}" >&2 || true
              docker rm -f "${name}" >/dev/null 2>&1 || true
              exit 1
            fi
            docker exec "${name}" /usr/local/bin/python3.14 -c \
              'import socket; [socket.create_connection(("127.0.0.1", port), 2).close() for port in (8099, 8787)]'
            docker rm -f "${name}" >/dev/null
          done
      - name: Scan source, history, and release artifacts for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: bash tools/run_gitleaks_ci.sh dist
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --draft \
            --title "Portfolio Architect ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES.md
          gh release upload "${GITHUB_REF_NAME}" dist/*
          gh release edit "${GITHUB_REF_NAME}" --draft=false
