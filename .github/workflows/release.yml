name: Publish immutable release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/ci-python-3.14-linux-x86_64.txt
      - name: Install hash-locked release dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r requirements/ci-python-3.14-linux-x86_64.txt
      - name: Validate repository publication metadata
        run: python tools/check_publication.py --strict
      - name: Verify tag matches integration version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('custom_components/portfolio_architect/manifest.json').read_text())['version'])
          PY
          )"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match v${version}" >&2
            exit 1
          }
      - name: Build and verify release artifacts
        run: ./tools/release_check.sh
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - name: Create draft release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${prerelease_args[@]}" \
            --verify-tag \
            --draft \
            --title "Portfolio Architect ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES.md
          gh release upload "${GITHUB_REF_NAME}" dist/*
          gh release edit "${GITHUB_REF_NAME}" --draft=false
