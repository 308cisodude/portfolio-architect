name: Validate with hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run hassfest using immutable container image
        env:
          HASSFEST_IMAGE: ghcr.io/home-assistant/hassfest@sha256:5bfa5a99e0871626094906c5c679a977de525e5b3f261aed1f8774c9083f601c
        shell: bash
        run: |
          action_home="${RUNNER_TEMP}/${GITHUB_JOB}-home"
          mkdir -p "${action_home}"
          docker run --rm \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -e GITHUB_ACTIONS=true \
            -e CI=true \
            -e HOME=/github/home \
            -e GITHUB_WORKSPACE=/github/workspace \
            -v "${action_home}:/github/home" \
            -v "${GITHUB_WORKSPACE}:/github/workspace" \
            -w /github/workspace \
            "${HASSFEST_IMAGE}"
