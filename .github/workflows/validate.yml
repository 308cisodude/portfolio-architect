name: Validate release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/ci-python-3.14-linux-x86_64.txt
      - name: Install hash-locked validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r requirements/ci-python-3.14-linux-x86_64.txt
      - name: Run deterministic release pipeline
        run: ./tools/release_check.sh
      - name: Build provider App images
        shell: bash
        run: |
          version="$(python - <<'PYAPPVERSION'
          import json
          from pathlib import Path
          print(json.loads(Path('custom_components/portfolio_architect/manifest.json').read_text())['version'])
          PYAPPVERSION
          )"
          for app in \
            portfolio_architect_gateway \
            portfolio_architect_gateway_dkb \
            portfolio_architect_gateway_trade_republic \
            portfolio_architect_gateway_import
          do
            docker build \
              --build-arg BUILD_VERSION="${version}" \
              --build-arg BUILD_ARCH=amd64 \
              --tag "portfolio-architect-${app}:validation" \
              "home_assistant_app/${app}"
          done
      - name: Smoke-test provider shell containers
        shell: bash
        run: |
          network="portfolio-architect-provider-smoke"
          supervisor_name="portfolio-architect-supervisor-smoke"
          supervisor_token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          mock_supervisor="${RUNNER_TEMP}/portfolio_architect_mock_supervisor.py"

          cleanup() {
            docker rm -f "${supervisor_name}" >/dev/null 2>&1 || true
            docker rm -f \
              portfolio-architect-portfolio_architect_gateway_dkb-smoke \
              portfolio-architect-portfolio_architect_gateway_trade_republic-smoke \
              portfolio-architect-portfolio_architect_gateway_import-smoke \
              >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
            rm -f "${mock_supervisor}"
          }
          trap cleanup EXIT

          cat >"${mock_supervisor}" <<'PYMOCKSUPERVISOR'
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TOKEN = os.environ["PA_VALIDATION_SUPERVISOR_TOKEN"]
          HOSTNAME = "portfolio-architect-gateway-validation"

          class Handler(BaseHTTPRequestHandler):
              def _authorized(self):
                  return self.headers.get("Authorization") == f"Bearer {TOKEN}"

              def _reply(self, status, data):
                  body = json.dumps({"result": "ok", "data": data}, separators=(",", ":")).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not self._authorized():
                      self.send_error(401)
                      return
                  if self.path != "/addons/self/info":
                      self.send_error(404)
                      return
                  self._reply(200, {"hostname": HOSTNAME})

              def do_POST(self):
                  if not self._authorized():
                      self.send_error(401)
                      return
                  if self.path != "/discovery":
                      self.send_error(404)
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  document = json.loads(self.rfile.read(length))
                  if document.get("service") != "portfolio_architect":
                      self.send_error(400)
                      return
                  self._reply(200, {"uuid": "0123456789abcdef0123456789abcdef"})

              def log_message(self, _format, *_args):
                  return

          ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()
          PYMOCKSUPERVISOR

          docker network create "${network}" >/dev/null
          docker run --detach --name "${supervisor_name}" \
            --network "${network}" \
            --network-alias supervisor \
            --env "PA_VALIDATION_SUPERVISOR_TOKEN=${supervisor_token}" \
            --volume "${mock_supervisor}:/mock_supervisor.py:ro" \
            --entrypoint /usr/local/bin/python3.14 \
            portfolio-architect-portfolio_architect_gateway_dkb:validation \
            /mock_supervisor.py >/dev/null
          sleep 1

          for app in \
            portfolio_architect_gateway_dkb \
            portfolio_architect_gateway_trade_republic \
            portfolio_architect_gateway_import
          do
            name="portfolio-architect-${app}-smoke"
            image="portfolio-architect-${app}:validation"
            mapfile -t provider_env < <(
              python tools/provider_shell_env.py "home_assistant_app/${app}/config.yaml"
            )
            test "${#provider_env[@]}" -eq 2
            docker run --detach --name "${name}" \
              --network "${network}" \
              --env "SUPERVISOR_TOKEN=${supervisor_token}" \
              --env "PA_PROVIDER_ID=${provider_env[0]}" \
              --env "PA_PROVIDER_NAME=${provider_env[1]}" \
              "${image}" >/dev/null
            sleep 2
            if ! test "$(docker inspect --format '{{.State.Running}}' "${name}")" = "true"; then
              docker logs "${name}" >&2 || true
              exit 1
            fi
            docker exec "${name}" /usr/local/bin/python3.14 -c \
              'import pathlib, socket, ssl; socket.create_connection(("127.0.0.1", 8099), 2).close(); hostname=pathlib.Path("/data/gateway/tls/hostname").read_text(encoding="ascii").strip(); context=ssl.create_default_context(cafile="/data/gateway/tls/ca-cert.pem"); raw=socket.create_connection(("127.0.0.1", 8787), 2); tls=context.wrap_socket(raw, server_hostname=hostname); tls.close()'
            docker rm -f "${name}" >/dev/null
          done
      - name: Scan source, history, and release artifacts for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: bash tools/run_gitleaks_ci.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-architect-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
