name: Validate release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/ci-python-3.14-linux-x86_64.txt
      - name: Install hash-locked validation dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r requirements/ci-python-3.14-linux-x86_64.txt
      - name: Run deterministic release pipeline
        run: ./tools/release_check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-architect-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
