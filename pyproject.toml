[project]
name = "portfolio-architect"
version = "1.35.1"
description = "Home Assistant-native portfolio policy and investment planning"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["custom_components/portfolio_architect", "gateway/src/portfolio_architect_gateway"]

[tool.coverage.report]
show_missing = true
skip_covered = false
